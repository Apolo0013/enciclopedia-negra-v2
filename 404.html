<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Enciclopédia Negra</title>
    <script type="text/javascript">
      // Pega a URL que o usuário tentou acessar e transforma em parâmetros de busca
      var segmentCount = 1; // 1 porque o repositório é /enciclopedia-negra-v2/
      var l = window.location;
      
      l.replace(
        l.protocol + '//' + l.host +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
